# Release of the engine on an annotated tag vX.Y.Z pushed on a commit of main.
# Order matters: every gate runs before the build, the GitHub Release is the last step.
# The Release is created by the preinstalled gh CLI with the token provided by Actions (no other secret).
# The checkout keeps no credential: the token is passed as GH_TOKEN only to the steps that need it.
name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SDLC_REQUIRE_NODE: "1"
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.21"
          enable-cache: false
      - name: git identity of the runner (same as the local test image)
        run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
          git config --global init.defaultBranch main
      - name: tag matches VERSION
        run: scripts/check-tag-version.sh "$TAG"
      - name: tag is annotated and reachable from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the token reaches this fetch through the environment only (never written to .git/config)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" "refs/heads/main:refs/remotes/origin/main"
          test "$(git cat-file -t "refs/tags/$TAG")" = tag || { echo "tag_not_annotated: $TAG" >&2; exit 1; }
          git merge-base --is-ancestor "refs/tags/$TAG^{commit}" refs/remotes/origin/main \
            || { echo "tag_not_on_main: $TAG" >&2; exit 1; }
      - name: release notes from CHANGELOG.md
        run: scripts/changelog-section.sh "$(cat VERSION)" > "$RUNNER_TEMP/notes.md"
      - name: install the test dependency
        run: python -m pip install pytest
      - name: tests
        run: python -m pytest -q -p no:cacheprovider tooling/tests
      - name: build
        working-directory: tooling
        run: uv build --out-dir dist
      - name: wheel smoke
        run: scripts/wheel-smoke.sh tooling/dist/harry_sdlc-*-py3-none-any.whl
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" tooling/dist/harry_sdlc-*-py3-none-any.whl tooling/dist/harry_sdlc-*.tar.gz \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
